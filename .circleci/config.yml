version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: default

      - run:
          name: Build Docker image
          command: |
            IMAGE=$(echo "ghcr.io/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')
            SHORT_SHA="${CIRCLE_SHA1:0:7}"

            TAGS="-t ${IMAGE}:${SHORT_SHA}"
            if [ "${CIRCLE_BRANCH}" = "master" ]; then
              TAGS="${TAGS} -t ${IMAGE}:latest -t ${IMAGE}:master"
            fi
            if [ -n "${CIRCLE_TAG}" ]; then
              TAGS="${TAGS} -t ${IMAGE}:${CIRCLE_TAG}"
            fi

            docker build \
              --label "org.opencontainers.image.source=https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" \
              --label "org.opencontainers.image.revision=${CIRCLE_SHA1}" \
              ${TAGS} \
              .

      - run:
          name: Push Docker image to GHCR
          command: |
            if [ "${CIRCLE_BRANCH}" != "master" ] && [ -z "${CIRCLE_TAG}" ]; then
              echo "Skipping push on branch ${CIRCLE_BRANCH}"
              exit 0
            fi

            if [ -z "${GHCR_TOKEN}" ]; then
              echo "GHCR_TOKEN environment variable is required to push to GHCR"
              exit 1
            fi

            IMAGE=$(echo "ghcr.io/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')
            SHORT_SHA="${CIRCLE_SHA1:0:7}"
            USERNAME="${GHCR_USERNAME:-${CIRCLE_PROJECT_USERNAME}}"

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${USERNAME}" --password-stdin

            docker push "${IMAGE}:${SHORT_SHA}"
            if [ "${CIRCLE_BRANCH}" = "master" ]; then
              docker push "${IMAGE}:latest"
              docker push "${IMAGE}:master"
            fi
            if [ -n "${CIRCLE_TAG}" ]; then
              docker push "${IMAGE}:${CIRCLE_TAG}"
            fi

workflows:
  docker-publish:
    jobs:
      - build-and-push:
          filters:
            tags:
              only: /^v.*/
