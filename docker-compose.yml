version: '3.8'

services:
  f1tv-token-service:
    build: .
    container_name: f1tv-token-service
    ports:
      - "${BIND_HOST:-127.0.0.1}:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DISPLAY=:99
      - DEBUG=${DEBUG:-false}
      - API_KEY=${API_KEY:-}
    volumes:
      # Mount debug directory to access screenshots
      - ./debug:/app/debug
      # Optional: Mount a persistent browser profile
      # - ./browser-data:/app/browser-data
    restart: unless-stopped
    # Increase shared memory size for Chromium
    shm_size: 2gb
